<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Stylized Palm Tree and Checkmark Invoice Overlay -->
  <g transform="translate(136, 120)">
    <!-- Palm Leaves -->
    <path d="M120,40 Q160,10 210,30 Q160,50 120,40" fill="url(#iconGrad)" filter="url(#glow)" />
    <path d="M120,40 Q60,10 30,50 Q80,65 120,40" fill="url(#iconGrad)" filter="url(#glow)" />
    <path d="M120,40 Q170,70 190,120 Q140,110 120,40" fill="url(#iconGrad)" filter="url(#glow)" />
    <path d="M120,40 Q70,70 50,120 Q100,110 120,40" fill="url(#iconGrad)" filter="url(#glow)" />
    <path d="M120,40 Q120,0 120,0 Q120,40 120,40" fill="none" stroke="url(#iconGrad)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Trunk with smooth curves -->
    <path d="M120,40 Q110,130 90,220" fill="none" stroke="url(#iconGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
    <path d="M110,40 Q100,130 80,220" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Digital Grid/Laptop base overlay -->
    <path d="M40,220 L200,220 Q215,220 210,230 L195,250 Q190,255 180,255 L60,255 Q50,255 45,250 L30,230 Q25,220 40,220 Z" fill="#0f172a" stroke="url(#iconGrad)" stroke-width="8" />
    
    <!-- Large glowing checkmark (symbolizing approved invoicing) -->
    <path d="M180,110 L210,140 L280,70" fill="none" stroke="#10b981" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M180,110 L210,140 L280,70" fill="none" stroke="#e0f2fe" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
